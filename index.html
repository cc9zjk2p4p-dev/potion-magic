<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#17152f"><title>포션 매직 - Potion Magic</title><style>
:root{--gold:#ffd77a;--cream:#fff8e9}*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);display:flex;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#39305e,#211d43 55%,#151329);color:var(--cream);font-family:system-ui}main{width:min(100%,520px);display:flex;flex-direction:column;padding:16px 4px}.top,.levelbar{display:flex;justify-content:space-between;align-items:center}.brand{color:var(--gold);font-weight:900;letter-spacing:2px}.coins{background:#302b53;border:1px solid #514775;border-radius:99px;padding:8px 13px;color:#ffe29a;font-weight:bold}h1{text-align:center;font-size:clamp(28px,8vw,39px);margin:18px 0 5px}.sub,.tip{text-align:center;color:#b9b4d2;font-size:13px}.levelbar{color:#b9b4d2;font-size:13px;margin:8px 3px}.levelbar strong{color:var(--gold);font-size:16px}.progress{height:7px;background:#383354;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#8d7cff,#ff9fbe);width:0}.board{flex:1;min-height:300px;display:flex;align-content:center;justify-content:center;align-items:center;flex-wrap:wrap;gap:20px 12px;padding:18px 3px}.tube-wrap{width:calc((100% - 52px)/4);max-width:82px;display:flex;justify-content:center}.tube{width:clamp(48px,12vw,64px);height:clamp(145px,36vw,185px);border:3px solid #e2e2ffcc;border-top:0;border-radius:0 0 19px 19px;display:flex;flex-direction:column-reverse;overflow:hidden;background:#ffffff12;cursor:pointer;padding:0}.tube.selected{transform:translateY(-12px);border-color:var(--gold)}.liquid{height:25%;width:100%;flex:none;border-top:1px solid #ffffff55}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:8px 0 12px}button{font:inherit;cursor:pointer;touch-action:manipulation}.tool{background:#302c53;color:#f7eecf;border:1px solid #514a77;border-radius:14px;padding:12px 4px;font-weight:800;font-size:13px}.tool small{display:block;color:#bdb5dc;font-size:10px;margin-top:3px}.primary{width:100%;padding:15px;border:0;border-radius:16px;background:linear-gradient(135deg,#ffdc8c,#ffad9e);color:#39264b;font-weight:1000;font-size:16px}.overlay{position:fixed;inset:0;background:#0b0a1dcc;display:none;align-items:center;justify-content:center;padding:22px}.overlay.show{display:flex}.modal{width:min(100%,350px);background:#30294f;border:1px solid #716394;border-radius:25px;padding:27px 22px;text-align:center}.modal h2{color:var(--gold)}.modal p{line-height:1.5;color:#d0cbe0}.footer{text-align:center;color:#797493;font-size:10px;margin-top:16px}</style><main>
<div class="top"><div class="brand">✦ POTION MAGIC ✦</div><div class="coins">🪙 <span id="coins">0</span></div></div><h1>마법 물약 정렬</h1><p class="sub">흩어진 색을 모아 마법의 물약을 완성하세요!</p><div class="levelbar"><span>STAGE <strong id="level">1</strong> · <span id="difficulty">초급</span></span><span id="moves">이동 0회</span></div><div class="progress"><span id="progress"></span></div><section class="board" id="board"></section><p class="tip" id="tip">병을 선택하고 물약을 옮길 병을 탭하세요.</p><div class="actions"><button class="tool" id="undo">↶ 되돌리기<small>한 수 취소</small></button><button class="tool" id="add">＋ 병 추가<small>25코인</small></button><button class="tool" id="restart">⟳ 다시 하기<small>스테이지 재시작</small></button></div><button class="primary" id="hint">✨ 힌트 보기 · 5코인</button><div class="footer">작은 마법사의 포션 연구실 · 오프라인 플레이 가능</div></main><div class="overlay" id="win"><div class="modal"><div style="font-size:50px">🧙‍♀️✨</div><h2>스테이지 클리어!</h2><p id="winText"></p><button class="primary" id="next">다음 스테이지 →</button></div></div><div class="overlay" id="hintModal"><div class="modal"><h2>🔮 마법사의 힌트</h2><p id="hintText"></p><button class="primary" id="closeHint">알겠어요!</button></div></div>
<script>(()=>{const $=id=>document.getElementById(id),colors=['#ff6685','#54c8ed','#ffc857','#a78bfa','#69d69a','#ff9f54','#ec7bd2','#a9d66f','#6c91ff','#d8a46a'];let level=1,coins=0,tubes=[],initial=[],selected=-1,moves=0,history=[],locked=false,addUsed=false;const cap=4,rand=n=>Math.floor(Math.random()*n),snap=()=>tubes.map(t=>t.slice());function newGame(){let count=Math.min(3+Math.floor((level-1)/2),10),all=[];for(let c=0;c<count;c++)for(let j=0;j<4;j++)all.push(c);tubes=Array.from({length:count+2},(_,i)=>i<count?all.slice(i*4,i*4+4):[]);let last=null,steps=35+level*18,done=0,guard=0;while(done<steps&&guard<steps*100){guard++;let opts=[];for(let a=0;a<tubes.length;a++){if(!tubes[a].length)continue;let c=tubes[a].at(-1);for(let b=0;b<tubes.length;b++){if(a===b||tubes[b].length>=4||(tubes[b].length&&tubes[b].at(-1)!==c)||(last&&last[0]===b&&last[1]===a))continue;opts.push([a,b])}}if(!opts.length)break;let m=opts[rand(opts.length)],a=m[0],b=m[1];tubes[b].push(tubes[a].pop());last=m;done++}initial=snap();selected=-1;moves=0;history=[];locked=false;addUsed=false;render();$('level').textContent=level;$('difficulty').textContent=level<4?'초급':level<8?'중급':level<14?'고급':'전문가';$('moves').textContent='이동 0회';$('progress').style.width='0%';$('coins').textContent=coins;$('tip').textContent='색깔이 섞인 병을 정리하세요. 두 개의 빈 병을 전략적으로 활용하세요.'}function render(){let board=$('board');board.innerHTML='';tubes.forEach((t,i)=>{let w=document.createElement('div');w.className='tube-wrap';let e=document.createElement('button');e.className='tube'+(selected===i?' selected':'');t.forEach(c=>{let d=document.createElement('div');d.className='liquid';d.style.background=colors[c];e.appendChild(d)});e.onclick=()=>tap(i);w.appendChild(e);board.appendChild(w)})}function tap(i){if(locked)return;if(selected<0){if(tubes[i].length){selected=i;render()}return}if(selected===i){selected=-1;render();return}let a=tubes[selected],b=tubes[i],c=a.at(-1);if(a.length&&b.length<4&&(!b.length||b.at(-1)===c)){history.push(snap());while(a.length&&a.at(-1)===c&&b.length<4)b.push(a.pop());moves++;$('moves').textContent='이동 '+moves+'회';selected=-1;render();checkWin()}else{selected=tubes[i].length?i:-1;render()}}function checkWin(){if(tubes.every(t=>!t.length||(t.length===4&&t.every(c=>c===t[0])))&&tubes.some(t=>t.length)){locked=true;let reward=10+level*2;coins+=reward;$('coins').textContent=coins;$('progress').style.width='100%';$('winText').textContent='물약 완성! '+moves+'번 이동 · 코인 '+reward+'개 획득';$('win').classList.add('show')}}$('undo').onclick=()=>{if(history.length){tubes=history.pop();moves=Math.max(0,moves-1);selected=-1;$('moves').textContent='이동 '+moves+'회';render()}};$('add').onclick=()=>{if(addUsed){$('tip').textContent='추가 병은 스테이지당 한 번만 사용할 수 있어요.';return}if(coins<25){$('tip').textContent='코인 25개가 필요해요. 스테이지를 클리어하세요.';return}coins-=25;addUsed=true;tubes.push([]);$('coins').textContent=coins;render()};$('restart').onclick=()=>{tubes=initial.map(t=>t.slice());history=[];moves=0;selected=-1;locked=false;$('moves').textContent='이동 0회';$('progress').style.width='0%';render()};$('hint').onclick=()=>{if(coins<5){$('tip').textContent='힌트에는 코인 5개가 필요해요.';return}let found=null;for(let a=0;a<tubes.length&&!found;a++)if(tubes[a].length){let c=tubes[a].at(-1);for(let b=0;b<tubes.length;b++)if(a!==b&&tubes[b].length<4&&(!tubes[b].length||tubes[b].at(-1)===c)){found=[a+1,b+1];break}}coins-=5;$('coins').textContent=coins;$('hintText').textContent=found?'병 '+found[0]+'번에서 '+found[1]+'번으로 옮겨보세요.':'다른 색 위에 같은 색을 모아보세요.';$('hintModal').classList.add('show')};$('closeHint').onclick=()=>$('hintModal').classList.remove('show');$('next').onclick=()=>{$('win').classList.remove('show');level++;newGame()};newGame()})();</script></html>
