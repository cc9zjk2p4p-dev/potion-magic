])nodes[from].classList.add('pour-from');if(nodes[i])nodes[i].classList.add('pour-to');history.push(snap());setTimeout(()=>{while(a.length&&a.at(-1)===c&&b.length<4)b.push(a.pop());moves++;$('moves').textContent='이동 '+moves+'회';selected=-1;animating=false;playPour();render();checkWin()},360)}else{selected=tubes[i].length?i:-1;render()}}function checkWin(){if(tubes.every(t=>!t.length||(t.length===4&&t.every(c=>c===t[0])))&&tubes.some(t=>t.length)){locked=true;let reward=dailyMode?25:10+level*2+(level%5===0?15:0),bossDefeated=!dailyMode&&level%5===0,colorsCount=tubes.filter(t=>t.length).length,earned=moves<=colorsCount*7+5?3:moves<=colorsCount*11+10?2:1,potionReward=null;if(dailyMode){let today=new Date().toLocaleDateString('en-CA');try{if(localStorage.getItem('pm-daily')===today)reward=0;else localStorage.setItem('pm-daily',today)}catch(e){}dailyMode=false}else{stars[level]=Math.max(stars[level]||0,earned);unlocked=Math.max(unlocked,level+1);if(!collection.includes(level)){collection.push(level);potionReward=level%5===0?"전설 물약":level%3===0?"희귀 물약":"마법 물약"}level++}coins+=reward;best=Math.max(best,earned);save();$('coins').textContent=coins;$('best').textContent=best+'★';$('progress').style.width='100%';$('winText').textContent=(bossDefeated?'👑 보스 격파! 보너스 +15코인 · ':'')+'물약 완성! '+('★'.repeat(earned))+' · '+moves+'번 이동 · '+(reward?'코인 '+reward+'개 획득':'오늘의 보상은 이미 받았어요')+(potionReward?' · 🧪 '+potionReward+' 도감 등록!':'');$('win').classList.add('show')}}$('undo').onclick=()=>{if(history.length){tubes=history.pop();moves=Math.max(0,moves-1);selected=-1;$('moves').textContent='이동 '+moves+'회';render()}};$('add').onclick=()=>{if(addUsed){$('tip').textContent='추가 병은 스테이지당 한 번만 사용할 수 있어요.';return}if(coins<25){$('tip').textContent='코인 25개가 필요해요. 스테이지를 클리어하세요.';return}coins-=25;addUsed=true;save();tubes.push([]);$('coins').textContent=coins;render()};$('restart').onclick=()=>{tubes=initial.map(t=>t.slice());history=[];moves=0;selected=-1;locked=false;$('moves').textContent='이동 0회';$( reateElement('div');d.className='themebtn';d.style.opacity=got?'1':'.35';d.innerHTML='<span style="font-size:25px">'+(got?icons[i-1]:'🔒')+'</span><br><strong>'+(got?names[i-1]:'미발견 물약')+'</strong><br><small>'+rarity+'</small>';g.appendChild(d)}$('collectionInfo').textContent=collection.length+' / 25개 수집 · 스테이지 첫 클리어 보상';$('collectionModal').classList.add('show')}$('collectionBtn').onclick=openCollection;$('closeCollection').onclick=()=>$('collectionModal').classList.remove('show');$('soundToggle').onclick=()=>{soundOn=!soundOn;$('soundToggle').textContent=soundOn?'🔊 사운드 ON':'🔇 사운드 OFF';if(soundOn)playPour()};$('wizardBtn').onclick=openWizard;$('closeWizard').onclick=()=>$('wizardModal').classList.remove('show');$('worldBtn').onclick=openWorld;$('labBtn').onclick=openLab;$('achieveBtn').onclick=openAchievements;$('closeAchieve').onclick=()=>$('achieveModal').classList.remove('show');$('closeWorld').onclick=()=>$('worldModal').classList.remove('show');$('closeLab').onclick=()=>$('labModal').classList.remove('show');$('dailyBtn').onclick=()=>{let today=new Date().toLocaleDateString('en-CA');try{if(localStorage.getItem('pm-daily')===today){$('tip').textContent='오늘의 보상은 이미 받았어요. 내일 다시 도전하세요!';return}}catch(e){}dailyMode=true;level=Math.max(3,Math.min(unlocked,8));newGame();$('tip').textContent='오늘의 도전! 클리어하면 보너스 코인 25개를 받아요.'};$('power').onclick=()=>{if(locked)return;if(coins<8){$('tip').textContent='연쇄 마법에는 코인 8개가 필요해요.';return}let move=null;for(let a=0;a<tubes.length&&!move;a++){if(!tubes[a].length)continue;let color=tubes[a].at(-1);for(let b=0;b<tubes.length;b++)if(a!==b&&tubes[b].length<4&&(!tubes[b].length||tubes[b].at(-1)===color)){move=[a,b];break}}if(!move){$('tip').textContent='사용 가능한 마법 이동이 없어요.';return}coins-=8;history.push(snap());let [a,b]=move,color=tubes[a].at(-1);while(tubes[a].length&&tubes[a].at(-1)===color&&tubes[b].length<4)tubes[b].push(tubes[a].pop());moves++;selected=-1;$('coins').textContent=coins;$('moves').textContent='이동 '+moves+'회';save();rend
